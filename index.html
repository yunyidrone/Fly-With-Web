<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        var PC_BASE_WIDTH = 1920;
        var MOBILE_BASE_WIDTH = 375;
        var MOBILE_BREAKPOINT = 768;
        var baseFontSize = 16;
        function isBackendHashRoute() {
          var hash = location.hash || "";
          return hash.indexOf("#/backend") === 0;
        }
        function setRem() {
          if (isBackendHashRoute()) {
            document.documentElement.style.fontSize = baseFontSize + "px";
            return;
          }
          var w = document.documentElement.clientWidth;
          var scale;
          if (w >= MOBILE_BREAKPOINT) {
            scale = w / PC_BASE_WIDTH;
          } else {
            scale = w / MOBILE_BASE_WIDTH;
            scale = Math.max(0.3, Math.min(scale, 0.36));
          }
          document.documentElement.style.fontSize = baseFontSize * scale + "px";
        }
        window.__syncAppRemRoot = setRem;
        setRem();
        window.addEventListener("resize", setRem);
        window.addEventListener("hashchange", setRem);
      })();
    </script>
    <title>伴飞</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
